# permissions for end users to edit fulfillstorageclassclaims.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fulfillstorageclassclaim-editor-role
rules:
- apiGroups:
  - ocs.openshift.io
  resources:
  - fulfillstorageclassclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ocs.openshift.io
  resources:
  - fulfillstorageclassclaims/status
  verbs:
  - get
